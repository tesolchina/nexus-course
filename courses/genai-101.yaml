        function step(current) {
          return current.length >= 12 ? "done: " + current : "next: " + current + "x";
        }

        function run(start, maxSteps) {
          let current = start;
          let steps = 0;
          // TODO: loop while step() says "next:" and steps < maxSteps
          return { steps, final: current };
        }

        console.log(JSON.stringify(run("ab", 3)));
